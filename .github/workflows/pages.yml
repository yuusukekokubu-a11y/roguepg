# GitHub Pages への公開：既定のブランチに変更が入るたびに、ゲームを作り直して公開する。
# 初回だけ、GitHub の Settings → Pages で「Source」を「GitHub Actions」にしておく必要がある。
name: GitHub Pages に公開

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 既定のブランチのときだけ公開する（ほかのブランチの作業中の変更は公開しない）
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
